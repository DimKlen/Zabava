# APK Android : à chaque fusion sur main qui touche l'app, ou à la main depuis l'onglet
# Actions. Construit l'APK « preview » sur le runner (`eas build --local` : gratuit, hors
# quota EAS ; même clé de signature, téléchargée depuis EAS), puis le publie dans une
# release GitHub.
name: APK Android

on:
  push:
    branches: [main]
    # Une fusion seulement backend ne change pas l'APK : pas de build EAS gaspillé.
    paths: ['mobile/**']
  workflow_dispatch:

concurrency:
  group: apk
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  apk:
    name: Build local et release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Installer les dépendances
        run: npm ci

      # Le secret EAS n'est lisible que sur les serveurs d'EAS : copie en secret GitHub,
      # écrite hors du projet (le build local ne copie que les fichiers versionnés).
      - name: google-services.json
        env:
          CONTENT: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$CONTENT" ]; then
            echo "::error::Secret GOOGLE_SERVICES_JSON manquant : gh secret set GOOGLE_SERVICES_JSON < mobile/google-services.json"
            exit 1
          fi
          printf '%s' "$CONTENT" > "$RUNNER_TEMP/google-services.json"

      # Dépendances Gradle et caches de compilation, réutilisés d'un build à l'autre.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('mobile/package-lock.json') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build local (preview, Android)
        env:
          GOOGLE_SERVICES_JSON: ${{ runner.temp }}/google-services.json
          # Téléphone en arm64 seulement : environ deux fois moins de code natif à compiler
          # (cet APK ne s'installe plus dans un émulateur x86_64).
          ORG_GRADLE_PROJECT_reactNativeArchitectures: arm64-v8a
        run: eas build --profile preview --platform android --local --non-interactive --output zabava-${{ github.run_number }}.apk

      - name: Publier la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="apk-${{ github.run_number }}"
          gh release create "$tag" "zabava-${{ github.run_number }}.apk" \
            --target "${{ github.sha }}" \
            --title "APK Zabava #${{ github.run_number }}" \
            --notes "APK Android (profil preview), commit ${GITHUB_SHA::7}."

      - name: Garder les 2 releases APK les plus récentes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 100 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("apk-"))] | sort_by(.createdAt) | reverse | .[2:] | .[].tagName' |
          while read -r tag; do
            gh release delete "$tag" --yes --cleanup-tag
          done
