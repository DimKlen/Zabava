<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="styles.css">

<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
</helmet>
<div onClick="{{ item.open }}" onPointerDown="{{ item.down }}" onPointerUp="{{ item.up }}" onPointerLeave="{{ item.up }}" onPointerCancel="{{ item.up }}" onContextMenu="{{ item.ctx }}" style="position:relative;width:100%;aspect-ratio:2/3;border-radius:8px;overflow:hidden;background:{{ item.bg }};cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;box-shadow:var(--shadow-sm);transition:transform .15s" style-active="transform:scale(.97)">
  <div style="position:absolute;right:-4px;top:14%;font-size:76px;font-weight:600;line-height:1;color:var(--color-text);opacity:.08">{{ item.initial }}</div>
  <sc-if value="{{ item.showTitle }}" hint-placeholder-val="{{ true }}">
    <div style="position:absolute;left:8px;right:34px;bottom:8px;font-size:12px;font-weight:500;line-height:1.2;color:var(--color-text);text-wrap:pretty">{{ item.title }}</div>
  </sc-if>
  <sc-if value="{{ item.hasBadge }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;top:6px;left:6px;max-width:calc(100% - 12px);padding:2px 6px;border-radius:4px;font-size:10px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:{{ item.badgeBg }};color:{{ item.badgeColor }}">{{ item.badge }}</div>
  </sc-if>
  <sc-if value="{{ item.showAdd }}" hint-placeholder-val="{{ true }}">
    <button onClick="{{ item.toggle }}" onPointerDown="{{ item.stop }}" aria-label="Ajouter" style="position:absolute;right:2px;bottom:2px;width:36px;height:36px;padding:0;border:0;background:none;display:grid;place-items:center;cursor:pointer">
      <sc-if value="{{ item.inList }}" hint-placeholder-val="{{ false }}"><span style="width:26px;height:26px;border-radius:50%;background:var(--color-accent);color:var(--color-bg);display:grid;place-items:center;animation:pop .3s ease"><i class="ph ph-check" style="font-size:14px;font-weight:700"></i></span></sc-if>
      <sc-if value="{{ item.notInList }}" hint-placeholder-val="{{ true }}"><span style="width:26px;height:26px;border-radius:50%;background:color-mix(in srgb, var(--color-bg) 75%, transparent);border:1px solid var(--color-neutral-600);color:var(--color-text);display:grid;place-items:center"><i class="ph ph-plus" style="font-size:14px"></i></span></sc-if>
    </button>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:120,&quot;height&quot;:180},&quot;item&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;}}"></script>
</body>
</html>
