# APK Android : lancé à la main depuis l'onglet Actions. Construit l'APK
# « preview » sur EAS, puis le publie dans une release GitHub à télécharger.
name: APK Android

on:
  workflow_dispatch:

concurrency:
  group: apk
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  apk:
    name: Build EAS et release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Installer les dépendances
        run: npm ci

      - name: Build EAS (preview, Android)
        run: eas build --profile preview --platform android --non-interactive --wait --json > build.json

      - name: Télécharger l'APK
        run: curl -fsSL -o zabava.apk "$(jq -r '.[0].artifacts.applicationArchiveUrl' build.json)"

      - name: Publier la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="apk-${{ github.run_number }}"
          gh release create "$tag" zabava.apk \
            --target "${{ github.sha }}" \
            --title "APK Zabava #${{ github.run_number }}" \
            --notes "APK Android (profil preview), commit ${GITHUB_SHA::7}."
