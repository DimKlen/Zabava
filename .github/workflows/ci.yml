# CI Zabava : construit l'app mobile et le backend, puis lance tous les tests.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mobile:
    name: Mobile (types, lint, tests, bundle)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint .

      - name: Tests
        run: npx jest --ci

      - name: Bundle Android et iOS
        run: npx expo export --platform android --platform ios --output-dir dist

  backend:
    name: Backend (compilation, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # Les tests d'intégration démarrent PostgreSQL avec Testcontainers (Docker est fourni par le runner).
      - name: Compiler et tester
        run: ./gradlew build --no-daemon

      - name: Publier le contrat OpenAPI
        uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: backend/build/openapi.json
          if-no-files-found: error

      - name: Publier les rapports de tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-tests-backend
          path: backend/build/reports/tests/

  api-types:
    name: Types de l'API à jour
    needs: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: openapi
          path: backend/build

      # Échoue si src/api/types.ts n'a pas été régénéré après un changement de l'API.
      - name: Régénérer et comparer
        run: |
          npm run api:types
          git diff --exit-code -- src/api/types.ts
